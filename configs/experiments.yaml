# Danh sách thí nghiệm của từng người. Notebook gọi:
#   from banana_ripeness.experiment import load_experiments, run_grid
#   res = run_grid(load_experiments("configs/experiments.yaml", "luan"), data_root=DATA_ROOT)
#
# Mỗi mục = 1 mô hình (khoá `model`, xem banana_ripeness/models/__init__.py) + tham số của nó.
# Giá trị dạng list được tổ hợp hết (vd. 2 kernel x 2 không gian màu x 2 mask = 8 cấu hình).
# `schemes` / `seeds` (tuỳ chọn) ghi đè mặc định của run_grid: schemes [mixed, external], seeds [42].
# Tham số được chọn bằng GridSearchCV trên 5 fold theo nhóm của TẬP TRAIN (param_grid mặc định nằm trong code
# của từng mô hình; muốn đổi thì thêm khoá `param_grid: {C: [...]}`).

experiments:
  # ---------------- Luân: histogram màu + SVM / KNN ----------------
  luan:
    - model: svm_color
      kernel: [linear, rbf]
      space: [rgb, hsv]
      use_mask: [true, false]
      bins: 16
    - model: knn_color          # mốc so sánh
      space: [rgb, hsv]
      use_mask: [true, false]
      bins: 16

  # ---------------- Nguyên: HOG (khung, Nguyên tự sửa) ----------------
  nguyen:
    - model: hog_svm
      kernel: linear
      color_mode: gray
      use_mask: [true, false]

  # ---------------- Quỳnh: ResNet18 + Grad-CAM (khung, Quỳnh tự sửa) ----------------
  quynh:
    - model: resnet18
      pretrained: true
      epochs: 20
      use_mask: false
      seeds: [42, 43, 44]       # mạng nơ-ron: std lấy giữa các seed
